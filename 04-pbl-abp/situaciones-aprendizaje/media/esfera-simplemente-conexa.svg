<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Analogía: lazo en una esfera que se puede contraer a un punto">
  <rect width="480" height="220" fill="#f8fafc"/>
  <text x="240" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1e3a5f">Analogía 2D: en una esfera, todo lazo se puede contraer a un punto</text>
  <ellipse cx="140" cy="120" rx="90" ry="70" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <ellipse cx="140" cy="120" rx="90" ry="22" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <ellipse cx="140" cy="100" rx="35" ry="20" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="140" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">Lazo (rojo) sobre la esfera</text>
  <path d="M250 120 L300 120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <ellipse cx="380" cy="120" rx="90" ry="70" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="380" cy="110" r="6" fill="#dc2626"/>
  <text x="380" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">El lazo se contrae a un punto</text>
</svg>
