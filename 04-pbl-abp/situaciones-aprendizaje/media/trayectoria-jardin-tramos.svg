<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="640" height="360" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="600">Una trayectoria coherente en el jardín (una de las dos hojas)</text>
  <circle cx="220" cy="200" r="10" fill="#e74c3c"/>
  <text x="220" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#c0392b">R</text>
  <circle cx="380" cy="200" r="10" fill="#27ae60"/>
  <text x="380" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#1e8449">M</text>
  <line x1="220" y1="200" x2="380" y2="200" stroke="#bbb" stroke-width="1.5"/>
  <line x1="300" y1="40" x2="300" y2="320" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="308" y="55" font-size="11" fill="#2980b9">mediatriz r=m</text>
  <path d="M 300 60 A 160 160 0 0 0 220 200" fill="none" stroke="#8e44ad" stroke-width="3"/>
  <line x1="220" y1="200" x2="380" y2="200" stroke="#8e44ad" stroke-width="3"/>
  <line x1="380" y1="200" x2="560" y2="200" stroke="#8e44ad" stroke-width="3"/>
  <line x1="300" y1="60" x2="300" y2="40" stroke="#8e44ad" stroke-width="3"/>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8e44ad"/></marker>
  </defs>
  <line x1="300" y1="100" x2="300" y2="90" stroke="#8e44ad" stroke-width="2" marker-end="url(#a2)"/>
  <text x="250" y="100" font-size="11" fill="#6c3483">① mediatriz</text>
  <text x="200" y="140" font-size="11" fill="#6c3483">② arco centro M</text>
  <text x="280" y="190" font-size="11" fill="#6c3483">③ segmento RM</text>
  <text x="450" y="190" font-size="11" fill="#6c3483">④ rayo</text>
  <text x="320" y="345" text-anchor="middle" font-size="12" fill="#555">Orden: mediatriz → arco hasta la rosa → recta por la margarita y más allá</text>
</svg>
