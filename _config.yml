# Site settings — Máster Profesorado Matemáticas
# Tema: Just the Docs (remoto, versión fijada) para GitHub Pages

remote_theme: just-the-docs/just-the-docs@v0.10.1
title: Máster Profesorado Matemáticas
description: Materiales y recursos para el Máster en Profesorado de Matemáticas

repository: computerphysicslab/master-profesorado-matematicas

lang: es

nav_sort: case_insensitive
nav_enabled: true

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

aux_links:
  "GitHub":
    - "https://github.com/computerphysicslab/master-profesorado-matematicas"
aux_links_new_tab: true

heading_anchors: true

# Mermaid (diagramas en Markdown)
mermaid:
  version: "11.4.0"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - PLACEHOLDER
  - MANIFEST.md
  - "1.py"
  - "**/incorporar_ajedrez.py"
  - "**/.git"
  - "**/.gitignore"
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - "**/*.zip"
  - "**/*.mp3"
  - "**/*.py"
  - .github/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
  - scope:
      path: "99-archivo"
    values:
      nav_exclude: true
  - scope:
      path: "PLACEHOLDER"
    values:
      nav_exclude: true
