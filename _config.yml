# Site settings — Máster Profesorado Matemáticas
# Tema: Just the Docs (remoto) para GitHub Pages

remote_theme: just-the-docs/just-the-docs
title: Máster Profesorado Matemáticas
description: Materiales y recursos para el Máster en Profesorado de Matemáticas

# URL del repo (ajusta si usas Pages en proyecto)
repository: computerphysicslab/master-profesorado-matematicas

# Idioma y encoding
lang: es

# Navegación
nav_sort: case_insensitive
nav_enabled: true

# Búsqueda
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Enlaces auxiliares (esquina superior derecha)
aux_links:
  "GitHub":
    - "https://github.com/computerphysicslab/master-profesorado-matematicas"
aux_links_new_tab: true

# Anchors en encabezados
heading_anchors: true

# Color / logo (opcional)
# color_scheme: nil  # o "dark"

# Plugins compatibles con GitHub Pages
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Excluir del build (no páginas del sitio)
exclude:
  - PLACEHOLDER
  - MANIFEST.md
  - "**/.git"
  - "**/.gitignore"
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - "**/*.zip"
  - "**/*.mp3"

# Defaults: layout para Markdown
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
  - scope:
      path: "99-archivo"
    values:
      nav_exclude: true
  - scope:
      path: "PLACEHOLDER"
    values:
      nav_exclude: true
