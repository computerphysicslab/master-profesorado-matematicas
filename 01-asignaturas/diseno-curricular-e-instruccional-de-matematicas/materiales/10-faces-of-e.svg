<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-labelledby="title desc">
  <title id="title">The 10 Faces of e</title>
  <desc id="desc">Infographic showing ten mathematical faces of the constant e: definition, Euler identity, formula, limit, series, derivative, integral, logarithm, compound interest, Gaussian integral and exponential decay.</desc>

  <defs>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 36px; font-weight: bold; fill: #1a365d; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #4a5568; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1a365d; }
      .card-body { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #2d3748; }
      .math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 14px; fill: #1a202c; }
      .math-lg { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 18px; fill: #1a202c; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #fff; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #4a5568; }
    </style>
  </defs>

  <rect width="900" height="1100" fill="#f7fafc"/>

  <rect x="0" y="0" width="900" height="72" fill="#2b6cb0"/>
  <text x="450" y="46" text-anchor="middle" class="title" fill="#ffffff">The 10 Faces of e</text>

  <rect x="20" y="88" width="420" height="130" rx="10" fill="#ebf8ff" stroke="#90cdf4" stroke-width="1.5"/>
  <text x="36" y="112" class="card-title">What is e?</text>
  <text x="36" y="132" class="card-body">e is a fundamental mathematical constant,</text>
  <text x="36" y="146" class="card-body">approximately 2.718281828459045…</text>
  <text x="36" y="160" class="card-body">It is irrational and transcendental, named</text>
  <text x="36" y="174" class="card-body">after Leonhard Euler (1707–1783).</text>
  <text x="36" y="194" class="card-body">It appears in mathematics, physics,</text>
  <text x="36" y="208" class="card-body">engineering, finance and probability.</text>

  <circle cx="380" cy="153" r="38" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="380" y="148" text-anchor="middle" class="card-title" font-size="11">Leonhard</text>
  <text x="380" y="164" text-anchor="middle" class="card-title" font-size="11">Euler</text>

  <rect x="460" y="88" width="420" height="130" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <circle cx="482" cy="108" r="14" fill="#e53e3e"/>
  <text x="482" y="113" text-anchor="middle" class="badge">1</text>
  <text x="505" y="113" class="card-title">Euler's Identity</text>
  <text x="670" y="155" text-anchor="middle" class="math-lg">e^{iπ} + 1 = 0</text>
  <text x="480" y="185" class="card-body">Connects five fundamental constants:</text>
  <text x="480" y="200" class="card-body">e, i, π, 1 and 0.  (e^{iπ} = −1)</text>

  <rect x="20" y="234" width="280" height="145" rx="10" fill="#f0fff4" stroke="#68d391" stroke-width="1.5"/>
  <circle cx="42" cy="254" r="14" fill="#38a169"/>
  <text x="42" y="259" text-anchor="middle" class="badge">2</text>
  <text x="65" y="259" class="card-title">Euler's Formula</text>
  <text x="160" y="295" text-anchor="middle" class="math">e^{ix} = cos x + i sin x</text>
  <text x="36" y="325" class="card-body">Links exponential and</text>
  <text x="36" y="339" class="card-body">trigonometric functions.</text>
  <text x="36" y="353" class="card-body">Holds for all real (and</text>
  <text x="36" y="367" class="card-body">complex) values of x.</text>

  <rect x="310" y="234" width="280" height="145" rx="10" fill="#faf5ff" stroke="#b794f4" stroke-width="1.5"/>
  <circle cx="332" cy="254" r="14" fill="#805ad5"/>
  <text x="332" y="259" text-anchor="middle" class="badge">3</text>
  <text x="355" y="259" class="card-title">Limit Definition</text>
  <text x="450" y="295" text-anchor="middle" class="math">e = lim (1 + 1/n)^n</text>
  <text x="450" y="312" text-anchor="middle" class="subtitle">n → ∞</text>
  <text x="326" y="340" class="card-body">Defines e as the limit of a</text>
  <text x="326" y="354" class="card-body">sequence; describes continuous</text>
  <text x="326" y="368" class="card-body">growth.</text>

  <rect x="600" y="234" width="280" height="145" rx="10" fill="#fffaf0" stroke="#f6ad55" stroke-width="1.5"/>
  <circle cx="622" cy="254" r="14" fill="#dd6b20"/>
  <text x="622" y="259" text-anchor="middle" class="badge">4</text>
  <text x="645" y="259" class="card-title">Infinite Series</text>
  <text x="740" y="290" text-anchor="middle" class="math">e = Σ 1/n!</text>
  <text x="740" y="308" text-anchor="middle" class="subtitle">n = 0 → ∞</text>
  <text x="616" y="335" class="card-body">e = 1 + 1 + 1/2! + 1/3! + …</text>
  <text x="616" y="352" class="card-body">Converges very rapidly.</text>

  <rect x="20" y="395" width="280" height="145" rx="10" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.5"/>
  <circle cx="42" cy="415" r="14" fill="#3182ce"/>
  <text x="42" y="420" text-anchor="middle" class="badge">5</text>
  <text x="65" y="420" class="card-title">Exponential Derivative</text>
  <text x="160" y="455" text-anchor="middle" class="math">d/dx e^x = e^x</text>
  <text x="36" y="485" class="card-body">The exponential is the unique</text>
  <text x="36" y="499" class="card-body">function (up to a constant</text>
  <text x="36" y="513" class="card-body">factor) equal to its derivative.</text>

  <rect x="310" y="395" width="280" height="145" rx="10" fill="#f0fff4" stroke="#68d391" stroke-width="1.5"/>
  <circle cx="332" cy="415" r="14" fill="#38a169"/>
  <text x="332" y="420" text-anchor="middle" class="badge">6</text>
  <text x="355" y="420" class="card-title">Exponential Integral</text>
  <text x="450" y="455" text-anchor="middle" class="math">∫ e^x dx = e^x + C</text>
  <text x="326" y="485" class="card-body">The antiderivative of e^x is</text>
  <text x="326" y="499" class="card-body">e^x itself (plus a constant).</text>

  <rect x="600" y="395" width="280" height="145" rx="10" fill="#fff5f5" stroke="#fc8181" stroke-width="1.5"/>
  <circle cx="622" cy="415" r="14" fill="#e53e3e"/>
  <text x="622" y="420" text-anchor="middle" class="badge">7</text>
  <text x="645" y="420" class="card-title">Natural Logarithm</text>
  <text x="740" y="455" text-anchor="middle" class="math">ln(e^x) = x</text>
  <text x="616" y="485" class="card-body">ln is the inverse function of</text>
  <text x="616" y="499" class="card-body">the exponential based on e.</text>
  <text x="616" y="513" class="card-body">Domain x > 0.</text>

  <rect x="20" y="556" width="280" height="145" rx="10" fill="#faf5ff" stroke="#b794f4" stroke-width="1.5"/>
  <circle cx="42" cy="576" r="14" fill="#805ad5"/>
  <text x="42" y="581" text-anchor="middle" class="badge">8</text>
  <text x="65" y="581" class="card-title">Compound Interest</text>
  <text x="160" y="615" text-anchor="middle" class="math">A = P e^{rt}</text>
  <text x="36" y="645" class="card-body">Continuous compounding:</text>
  <text x="36" y="659" class="card-body">P = principal, r = rate,</text>
  <text x="36" y="673" class="card-body">t = time. A = future amount.</text>

  <rect x="310" y="556" width="280" height="145" rx="10" fill="#fffaf0" stroke="#f6ad55" stroke-width="1.5"/>
  <circle cx="332" cy="576" r="14" fill="#dd6b20"/>
  <text x="332" y="581" text-anchor="middle" class="badge">9</text>
  <text x="355" y="581" class="card-title">Gaussian Integral</text>
  <text x="450" y="615" text-anchor="middle" class="math">∫ e^{−x²} dx = √π</text>
  <text x="450" y="632" text-anchor="middle" class="subtitle">(from −∞ to +∞)</text>
  <text x="326" y="658" class="card-body">Central in probability,</text>
  <text x="326" y="672" class="card-body">statistics and physics.</text>

  <rect x="600" y="556" width="280" height="145" rx="10" fill="#ebf8ff" stroke="#63b3ed" stroke-width="1.5"/>
  <circle cx="622" cy="576" r="14" fill="#3182ce"/>
  <text x="622" y="581" text-anchor="middle" class="badge">10</text>
  <text x="645" y="581" class="card-title">Exponential Decay</text>
  <text x="740" y="615" text-anchor="middle" class="math">N(t) = N₀ e^{−λi}</text>
  <text x="616" y="645" class="card-body">Models radioactive decay,</text>
  <text x="616" y="659" class="card-body">population decline, cooling,</text>
  <text x="616" y="673" class="card-body">capacitor discharge, etc.</text>

  <rect x="20" y="720" width="860" height="100" rx="10" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="40" y="748" class="card-title">Abstract structure → concrete faces</text>
  <text x="40" y="768" class="card-body">The same constant e appears as limit, series, differential equation solution, inverse of ln,</text>
  <text x="40" y="782" class="card-body">growth/decay law and Gaussian kernel. Teaching that starts from the structure (limit or series)</text>
  <text x="40" y="796" class="card-body">and then specialises to finance, physics or probability follows the abstract→concrete path (Davydov).</text>

  <rect x="20" y="840" width="860" height="180" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="40" y="868" class="card-title">Where in the Spanish curriculum (Bachillerato / 4º ESO)?</text>
  <text x="40" y="892" class="card-body">• 1º Bach. Matemáticas I / CCSS I — exponential & log; continuous growth (faces 3, 5, 7, 8, 10)</text>
  <text x="40" y="908" class="card-body">• 2º Bach. Matemáticas II — series, complex numbers, Euler formula/identity (faces 1, 2, 4)</text>
  <text x="40" y="924" class="card-body">• 2º Bach. Matemáticas CCSS II — finance continuous compounding (face 8); basic calculus</text>
  <text x="40" y="940" class="card-body">• Optional bridge — Gaussian integral & probability (face 9) in statistics / physics</text>
  <text x="40" y="964" class="card-body">Learning situation idea: start from the limit or series definition (abstract model), then branch</text>
  <text x="40" y="980" class="card-body">to two applications (e.g. continuous interest + radioactive decay) and close with Euler’s identity.</text>
  <text x="40" y="1000" class="card-body">Aligns with LOMLOE situaciones de aprendizaje while keeping the theoretical structure first.</text>

  <rect x="0" y="1040" width="900" height="60" fill="#2b6cb0"/>
  <text x="450" y="1065" text-anchor="middle" class="footer" fill="#ffffff">Sciences KL · Adapted for educational use · Constant e</text>
  <text x="450" y="1085" text-anchor="middle" class="footer" fill="#bee3f8">Abstract → concrete · Suitable for Bachillerato learning situations</text>
</svg>
