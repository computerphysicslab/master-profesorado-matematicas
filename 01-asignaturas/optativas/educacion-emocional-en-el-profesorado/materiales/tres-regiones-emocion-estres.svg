<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" role="img" aria-labelledby="title desc">
  <title id="title">Tres regiones, una misma historia</title>
  <desc id="desc">Amígdala (alerta emocional), hipocampo (memoria y contexto) y corteza prefrontal (regulación): cómo interpretamos lo que vivimos.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="920" height="720" fill="url(#bg)"/>

  <text x="460" y="42" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Tres regiones, una misma historia</text>
  <text x="460" y="70" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#475569">Cómo interpretamos lo que vivimos</text>

  <g transform="translate(300,90)" filter="url(#shadow)">
    <path d="M40,180 C20,140 30,80 80,50 C120,20 180,15 230,30 C280,45 320,80 340,130 C355,170 350,220 320,250 C290,280 230,290 180,280 C120,268 60,240 40,180 Z" fill="#f5d0c5" stroke="#d4a59a" stroke-width="2"/>
    <path d="M55,160 C40,120 55,70 100,50 C130,38 155,45 165,70 C170,100 150,140 120,165 C95,180 70,175 55,160 Z" fill="#3b82f6" opacity="0.92"/>
    <ellipse cx="175" cy="175" rx="18" ry="12" fill="#ef4444"/>
    <path d="M185,165 C210,155 240,160 255,180 C268,198 255,215 230,218 C210,220 195,205 188,185" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
    <path d="M185,165 C210,155 240,160 255,180 C268,198 255,215 230,218 C210,220 195,205 188,185" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="280" cy="240" rx="35" ry="28" fill="#c4b5fd" opacity="0.7"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="120" width="210" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="55" y="145" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Corteza prefrontal</text>
    <text x="55" y="165" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e3a8a">(regulación)</text>
    <text x="55" y="185" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">Analiza, valora, toma decisiones</text>
    <text x="55" y="200" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">y regula la respuesta emocional.</text>
  </g>
  <path d="M250,160 C280,155 300,150 320,140" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="280" width="210" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="55" y="305" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">Amígdala</text>
    <text x="55" y="325" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#7f1d1d">(alerta emocional)</text>
    <text x="55" y="345" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">Detecta amenazas, genera una</text>
    <text x="55" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">respuesta rápida de alarma</text>
    <text x="55" y="375" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">y activa el cuerpo.</text>
  </g>
  <path d="M250,320 C300,300 340,280 460,265" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <g filter="url(#shadow)">
    <rect x="670" y="200" width="220" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="685" y="225" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#15803d">Hipocampo</text>
    <text x="685" y="245" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#14532d">(memoria y contexto)</text>
    <text x="685" y="265" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">Procesa la memoria y da contexto</text>
    <text x="685" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">a lo que vivimos (dónde, cuándo,</text>
    <text x="685" y="295" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#334155">qué pasaba).</text>
  </g>
  <path d="M670,250 C640,250 600,260 560,270" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="430" width="260" height="110" rx="12" fill="#fff1f2" stroke="#fecaca"/>
    <text x="60" y="460" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">Amígdala</text>
    <text x="60" y="485" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">• Alerta emocional</text>
    <text x="60" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">• Miedo y amenaza</text>
    <text x="60" y="525" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">• Activación del cuerpo</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="330" y="430" width="260" height="110" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="350" y="460" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#15803d">Hipocampo</text>
    <text x="350" y="485" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">• Memoria</text>
    <text x="350" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">• Contexto</text>
    <text x="350" y="525" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">• Lugar y tiempo</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="430" width="260" height="110" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="640" y="460" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Corteza prefrontal</text>
    <text x="640" y="485" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">• Regulación</text>
    <text x="640" y="505" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">• Pensamiento</text>
    <text x="640" y="525" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#334155">• Decisiones</text>
  </g>

  <g>
    <rect x="80" y="580" width="140" height="40" rx="20" fill="#ef4444"/>
    <text x="150" y="605" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">Alerta</text>
    <path d="M230,600 L300,600" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <rect x="310" y="580" width="140" height="40" rx="20" fill="#22c55e"/>
    <text x="380" y="605" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">Contexto</text>
    <path d="M460,600 L530,600" stroke="#64748b" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <rect x="540" y="580" width="160" height="40" rx="20" fill="#3b82f6"/>
    <text x="620" y="605" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">Regulación</text>
  </g>

  <text x="460" y="660" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#475569">Juntas nos ayudan a reaccionar, recordar y responder de forma equilibrada.</text>
  <text x="460" y="700" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">Modelo didáctico simplificado · Educación emocional en el profesorado</text>
</svg>
