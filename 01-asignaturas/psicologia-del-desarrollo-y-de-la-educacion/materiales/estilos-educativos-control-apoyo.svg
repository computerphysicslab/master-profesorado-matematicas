<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Estilos educativos según control y apoyo</title>
  <desc id="desc">Cuadrante 2×2: control (exigencia) en el eje vertical y apoyo (afecto) en el eje horizontal. Autoritario, democrático/autoritativo, negligente y permisivo.</desc>

  <rect width="700" height="560" fill="#ffffff"/>

  <!-- Cuadrantes -->
  <rect x="90" y="70" width="240" height="170" rx="12" fill="#A8C5D4"/>
  <rect x="370" y="70" width="240" height="170" rx="12" fill="#E8D5C8"/>
  <rect x="90" y="290" width="240" height="170" rx="12" fill="#B8D0DC"/>
  <rect x="370" y="290" width="240" height="170" rx="12" fill="#B8D0DC"/>

  <!-- Cruz de ejes -->
  <rect x="340" y="40" width="20" height="450" rx="3" fill="#2C3E50"/>
  <rect x="50" y="255" width="600" height="20" rx="3" fill="#2C3E50"/>

  <!-- Textos cuadrantes -->
  <g font-family="system-ui, Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <!-- Autoritario -->
    <text x="210" y="125" font-size="18" font-weight="700" fill="#ffffff">AUTORITARIO</text>
    <text x="210" y="155" font-size="13" font-weight="600" fill="#ffffff">Alto control · Bajo apoyo</text>
    <text x="210" y="185" font-size="12" fill="#f0f7fb">Normas rígidas, poco diálogo</text>
    <text x="210" y="205" font-size="12" fill="#f0f7fb">Poco calor emocional</text>

    <!-- Democrático -->
    <text x="490" y="118" font-size="16" font-weight="700" fill="#4A3728">DEMOCRÁTICO</text>
    <text x="490" y="140" font-size="15" font-weight="700" fill="#4A3728">/ AUTORITATIVO</text>
    <text x="490" y="168" font-size="13" font-weight="600" fill="#4A3728">Alto control · Alto apoyo</text>
    <text x="490" y="195" font-size="12" fill="#5C4033">Límites claros + escucha</text>
    <text x="490" y="215" font-size="12" fill="#5C4033">Autonomía progresiva</text>

    <!-- Negligente -->
    <text x="210" y="345" font-size="18" font-weight="700" fill="#ffffff">NEGLIGENTE</text>
    <text x="210" y="375" font-size="13" font-weight="600" fill="#ffffff">Bajo control · Bajo apoyo</text>
    <text x="210" y="405" font-size="12" fill="#f0f7fb">Poca supervisión</text>
    <text x="210" y="425" font-size="12" fill="#f0f7fb">Poca orientación y afecto</text>

    <!-- Permisivo -->
    <text x="490" y="345" font-size="18" font-weight="700" fill="#ffffff">PERMISIVO</text>
    <text x="490" y="375" font-size="13" font-weight="600" fill="#ffffff">Bajo control · Alto apoyo</text>
    <text x="490" y="405" font-size="12" fill="#f0f7fb">Afecto y libertad</text>
    <text x="490" y="425" font-size="12" fill="#f0f7fb">Límites escasos o inconsistentes</text>
  </g>

  <!-- Etiquetas de ejes -->
  <g font-family="system-ui, Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#2C3E50" font-size="13" font-weight="700">
    <text x="350" y="32" text-anchor="middle">↑ Alto CONTROL / EXIGENCIA</text>
    <text x="350" y="512" text-anchor="middle">↓ Bajo CONTROL / EXIGENCIA</text>
    <text x="40" y="268" text-anchor="middle" transform="rotate(-90 40 268)">← Bajo APOYO</text>
    <text x="660" y="268" text-anchor="middle" transform="rotate(90 660 268)">Alto APOYO →</text>
  </g>

  <text x="350" y="545" text-anchor="middle" font-family="system-ui, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#666666">
    Estilos educativos (Baumrind; Maccoby & Martin) · aplicable al liderazgo docente en el aula
  </text>
</svg>
