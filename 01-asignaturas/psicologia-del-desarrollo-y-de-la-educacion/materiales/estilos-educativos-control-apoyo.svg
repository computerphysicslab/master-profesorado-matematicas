<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540">
  <rect width="700" height="540" fill="#ffffff"/>

  <rect x="90" y="60" width="240" height="170" rx="12" fill="#A8C5D4"/>
  <rect x="370" y="60" width="240" height="170" rx="12" fill="#E8D5C8"/>
  <rect x="90" y="280" width="240" height="170" rx="12" fill="#B8D0DC"/>
  <rect x="370" y="280" width="240" height="170" rx="12" fill="#B8D0DC"/>

  <rect x="340" y="30" width="20" height="450" rx="3" fill="#2C3E50"/>
  <rect x="50" y="245" width="600" height="20" rx="3" fill="#2C3E50"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="210" y="115" font-size="18" font-weight="700" fill="#ffffff">AUTORITARIO</text>
    <text x="210" y="145" font-size="13" font-weight="600" fill="#ffffff">Alto control · Bajo apoyo</text>
    <text x="210" y="175" font-size="12" fill="#f0f7fb">Normas rígidas, poco diálogo</text>
    <text x="210" y="195" font-size="12" fill="#f0f7fb">Poco calor emocional</text>

    <text x="490" y="108" font-size="16" font-weight="700" fill="#4A3728">DEMOCRÁTICO</text>
    <text x="490" y="130" font-size="15" font-weight="700" fill="#4A3728">/ AUTORITATIVO</text>
    <text x="490" y="158" font-size="13" font-weight="600" fill="#4A3728">Alto control · Alto apoyo</text>
    <text x="490" y="185" font-size="12" fill="#5C4033">Límites claros + escucha</text>
    <text x="490" y="205" font-size="12" fill="#5C4033">Autonomía progresiva</text>

    <text x="210" y="335" font-size="18" font-weight="700" fill="#ffffff">NEGLIGENTE</text>
    <text x="210" y="365" font-size="13" font-weight="600" fill="#ffffff">Bajo control · Bajo apoyo</text>
    <text x="210" y="395" font-size="12" fill="#f0f7fb">Poca supervisión</text>
    <text x="210" y="415" font-size="12" fill="#f0f7fb">Poca orientación y afecto</text>

    <text x="490" y="335" font-size="18" font-weight="700" fill="#ffffff">PERMISIVO</text>
    <text x="490" y="365" font-size="13" font-weight="600" fill="#ffffff">Bajo control · Alto apoyo</text>
    <text x="490" y="395" font-size="12" fill="#f0f7fb">Afecto y libertad</text>
    <text x="490" y="415" font-size="12" fill="#f0f7fb">Límites escasos o inconsistentes</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#2C3E50" font-size="13" font-weight="700">
    <text x="350" y="24" text-anchor="middle">Alto CONTROL / EXIGENCIA</text>
    <text x="350" y="502" text-anchor="middle">Bajo CONTROL / EXIGENCIA</text>
    <text x="70" y="258" text-anchor="start" font-size="12">Bajo APOYO</text>
    <text x="630" y="258" text-anchor="end" font-size="12">Alto APOYO</text>
  </g>

  <text x="350" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666666">
    Estilos educativos (Baumrind; Maccoby y Martin) · liderazgo docente en el aula
  </text>
</svg>
